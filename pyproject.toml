[project]
name = "knowledge-graph-test"
version = "0.1.0"
description = "Hands-on learning project: movie knowledge graph on Neo4j, exposed via an MCP server to an LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]
